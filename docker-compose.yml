version: '3.8'

services:
  # ==========================================================
  # 1. Nginx Reverse Proxy (Ingress Gateway)
  # Matches the Architecture Diagram (Frontend -> Nginx -> Backend)
  # ==========================================================
  nginx:
    image: nginx:alpine
    container_name: poc-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"       # Inbound HTTP API and proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - seq
    networks:
      - app-network

  # ==========================================================
  # 2. Node.js Express REST API (Application / Logic Tier)
  # ==========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: poc-backend-api
    restart: unless-stopped
    ports:
      - "5000:5000"   # Direct port also accessible
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - ORACLE_USER=poc_user
      - ORACLE_PASSWORD=poc_password
      - ORACLE_CONNECT_STRING=oracle-db:1521/FREEPDB1
      - REDIS_URL=redis://redis:6379
      - CACHE_TTL_SECONDS=60
      - SEQ_URL=http://seq:80
      - AZURE_STORAGE_CONTAINER_NAME=oracle-backups
      - BACKUP_RETENTION_DAYS=7
    depends_on:
      redis:
        condition: service_healthy
      oracle-db:
        condition: service_started
      seq:
        condition: service_started
    networks:
      - app-network

  # ==========================================================
  # 3. Oracle Database 23ai Free (Data Tier)
  # ==========================================================
  oracle-db:
    image: gvenzl/oracle-free:slim
    container_name: poc-oracle-db
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=PocPassword123#
      - APP_USER=poc_user
      - APP_USER_PASSWORD=poc_password
    volumes:
      - ./backend/sql:/container-entrypoint-initdb.d:ro
      - oracle-data:/opt/oracle/oradata
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ==========================================================
  # 4. Redis In-Memory Cache (Caching Tier)
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: poc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================
  # 5. Seq Centralized Structured Logging Server
  # ==========================================================
  seq:
    image: datalust/seq:latest
    container_name: poc-seq-logs
    restart: unless-stopped
    ports:
      - "5341:80"     # Web Dashboard & HTTP Ingestion
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    volumes:
      - seq-data:/data
    networks:
      - app-network

  # ==========================================================
  # 6. Database Backup with Retention Policy (Cronjob Every 12hrs)
  # Streams backups to Azure Storage Account Blob container
  # ==========================================================
  db-backup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: poc-db-backup
    restart: unless-stopped
    command: ["node", "src/scripts/backupCron.js"]
    env_file:
      - ./backend/.env
    environment:
      - ORACLE_USER=poc_user
      - ORACLE_PASSWORD=poc_password
      - ORACLE_CONNECT_STRING=oracle-db:1521/FREEPDB1
      - SEQ_URL=http://seq:80
      - AZURE_STORAGE_CONTAINER_NAME=oracle-backups
      - BACKUP_CRON_SCHEDULE=0 */12 * * *
      - BACKUP_RETENTION_DAYS=7
    depends_on:
      - oracle-db
      - seq
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  oracle-data:
    driver: local
  redis-data:
    driver: local
  seq-data:
    driver: local
